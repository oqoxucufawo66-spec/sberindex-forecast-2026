# Конфигурация эксперимента. Все гиперпараметры и пути — здесь, а не в коде.
seed: 42

data:
  # Открытые данные конкурса (архив hackathonlicence.zip со страницы конкурса), см. data/README.md
  consumption: data/raw/consumption.parquet
  market_access: data/raw/market_access.parquet
  dictionary: data/raw/dict/t_dict_municipal_districts.xlsx
  events: data/external/events.csv
  # Берём только ряды без пропусков за все 24 месяца (2023-01 .. 2024-12)
  require_complete: true

protocol:
  # Тестовые месяцы: прогноз на каждый из них делается с точки отсчёта T - h
  test_months: ["2024-07", "2024-08", "2024-09", "2024-10", "2024-11", "2024-12"]
  horizons: [1, 3, 6, 12]
  # 60 случайных МО — «выборка разработки»: на ней выбирались модели и комбинации.
  # Итоговые метрики считаются на остальных МО (эти 60 исключаются).
  dev_territories: 60
  sample_territories: null     # null = все МО; число = случайная выборка МО (для быстрого прогона)

models:
  prophet:                     # базовая модель организаторов: настройки по умолчанию
    weekly_seasonality: false
    daily_seasonality: false
  lightgbm:
    objective: l1
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    verbose: -1
  chronos:
    model_id: amazon/chronos-bolt-small
    device: cpu
    batch_size: 4096

  chronos2_hybrid:             # Chronos-2 на локальной компоненте + национальный сезонный фактор
    model_id: amazon/chronos-2
    device: cpu
    batch_size: 1024

# Равновзвешенные комбинации (без подбора весов). Компоненты, которых нет на горизонте, пропускаются.
combos:
  combo_gbm_fm: [lightgbm, chronos2_hybrid]
  combo_gbm_fm_prophet: [lightgbm, chronos2_hybrid, prophet]
  combo_naive_prophet: [naive, prophet]

changepoints:
  # Значения ниже выбраны по полусинтетическому бенчмарку (лучший F1 при сигнале rel),
  # см. reports/results/cpd_benchmark.csv.
  # Ряд для поиска сдвигов: log(расходы МО) - log(медиана по всем МО той же категории).
  # Так убираются общая сезонность и общероссийские тренды, остаются локальные сдвиги.
  pelt: {model: l2, penalty: 8.0, min_size: 3}     # штраф = penalty * log(n) на стандартизованном ряду
  binseg: {model: l2, penalty: 8.0, min_size: 3}
  cusum: {threshold: 6.0, drift: 0.5, warmup: 3}
  benchmark:
    n_series: 1000
    penalty_grid: [2.0, 3.0, 5.0, 8.0]        # для PELT / BinSeg
    cusum_threshold_grid: [3.0, 4.0, 6.0, 8.0]
    shift_sizes: [0.10, 0.20, 0.30]   # величина ступенчатого сдвига, доля уровня
    shift_months: ["2024-04", "2024-10"]  # диапазон месяцев, куда вставляется сдвиг
    tolerance: 1                       # допуск по месяцу, ±мес.
    max_delay: 3                       # тревога засчитывается, если не позже чем через 3 мес.

output:
  dir: reports
